[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repomind"
version = "1.0.0"
description = "Agentic codebase understanding system"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # AI / Agents
    "openai>=1.30.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    # Vector DB
    "chromadb>=0.5.0",
    # Graph
    "networkx>=3.3",
    # Parsing
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    # HTTP
    "httpx>=0.27.0",
    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Logging
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

# -----------------------------------------------------------------------------
# Black
# -----------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py312"]

# -----------------------------------------------------------------------------
# isort
# -----------------------------------------------------------------------------
[tool.isort]
profile = "black"
known_first_party = ["app"]

# -----------------------------------------------------------------------------
# mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
